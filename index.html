<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoS'26-01 Basari Tahminleri</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f9f8f7;min-height:100vh;padding:24px;color:#111;}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
.topbar-title{font-size:19px;font-weight:500;color:#111;letter-spacing:-0.3px;}
.topbar-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.topbar-right-row{display:flex;align-items:center;gap:8px;}
.badge-live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:#db0962;background:#fce8f1;padding:5px 12px;border-radius:20px;}
.badge-dot{width:7px;height:7px;border-radius:50%;background:#db0962;animation:pulse 1.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.refresh-btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:#888;background:#fff;border:0.5px solid #ddd;padding:5px 12px;border-radius:20px;cursor:pointer;transition:background .15s;}
.refresh-btn:hover{background:#f5f5f3;}
.refresh-btn:disabled{opacity:.5;cursor:not-allowed;}
.refresh-icon{width:13px;height:13px;}
.refresh-icon.spin{animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.update-info{font-size:11px;color:#bbb;text-align:right;}
.tabs{display:flex;border-bottom:0.5px solid #e0ded9;margin-bottom:20px;}
.tab{font-size:13px;font-weight:500;color:#aaa;padding:8px 18px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-0.5px;transition:color .15s,border-color .15s;background:none;border-top:none;border-left:none;border-right:none;}
.tab.active{color:#db0962;border-bottom:2px solid #db0962;}
.tab-content{display:none;}
.tab-content.active{display:block;}
.summary-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px;}
@media(max-width:600px){.summary-row{grid-template-columns:repeat(2,minmax(0,1fr));}}
.stat-card{background:#fff;border-radius:12px;border:0.5px solid #e5e3de;padding:14px 16px;}
.stat-label{font-size:11px;color:#999;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.stat-value{font-size:21px;font-weight:500;color:#111;}
.stat-value.accent{color:#db0962;}
.stat-sub{font-size:12px;color:#bbb;margin-top:3px;}
.section-title{font-size:11px;font-weight:500;color:#bbb;text-transform:uppercase;letter-spacing:.7px;margin:4px 0 12px;}
.bets-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:20px;}
@media(max-width:600px){.bets-grid{grid-template-columns:1fr;}}
.bet-card{background:#fff;border-radius:12px;border:0.5px solid #e5e3de;overflow:hidden;}
.bet-card.done{border-left:3px solid #db0962;border-radius:0 12px 12px 0;}
.bet-card-header{display:flex;align-items:center;justify-content:space-between;padding:11px 14px 9px;border-bottom:0.5px solid #f0eeeb;}
.bet-cat{font-size:11px;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:.4px;}
.pill{font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;}
.pill-done{background:#fce8f1;color:#db0962;}
.pill-open{background:#f0eeeb;color:#aaa;}
.bet-section{padding:10px 14px;border-bottom:0.5px solid #f7f6f4;}
.bet-section:last-child{border-bottom:none;}
.bet-section-label{font-size:10px;color:#ccc;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
.result-person{font-size:13px;font-weight:500;color:#db0962;}
.result-detail{font-size:11px;color:#aaa;margin-top:1px;}
.winners-list{display:flex;flex-direction:column;gap:3px;}
.winner-row{display:flex;align-items:center;gap:6px;font-size:12px;color:#555;}
.winner-num{font-size:10px;color:#ccc;width:12px;}
.winner-dot{width:5px;height:5px;border-radius:50%;background:#db0962;flex-shrink:0;}
.pending-name{font-size:12px;color:#aaa;font-style:italic;}
.current-leader{font-size:13px;font-weight:500;color:#555;}
.current-detail{font-size:11px;color:#aaa;margin-top:1px;}
.bets-table-wrap{background:#fff;border-radius:12px;border:0.5px solid #e5e3de;overflow:hidden;margin-bottom:20px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead tr{background:#fafaf9;}
thead th{padding:9px 14px;text-align:left;font-size:11px;font-weight:500;color:#bbb;text-transform:uppercase;letter-spacing:.5px;border-bottom:0.5px solid #f0eeeb;}
tbody tr{border-bottom:0.5px solid #f7f6f4;}
tbody tr:last-child{border-bottom:none;}
tbody td{padding:10px 14px;color:#333;vertical-align:middle;}
.name-cell{display:flex;align-items:center;}
.avatar{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;margin-right:8px;flex-shrink:0;}
.av-top{background:#fce8f1;color:#db0962;}
.av-gray{background:#f0eeeb;color:#aaa;}
.rank-num{font-size:13px;color:#bbb;}
.rank-1st{color:#b8860b;font-weight:500;}
.cups{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.devam{font-size:12px;color:#bbb;}
.pred-table-wrap{background:#fff;border-radius:12px;border:0.5px solid #e5e3de;overflow:auto;margin-bottom:20px;}
.pred-table{width:100%;border-collapse:collapse;font-size:12px;min-width:580px;}
.pred-table thead th{padding:9px 12px;text-align:left;font-size:10px;font-weight:500;color:#bbb;text-transform:uppercase;letter-spacing:.5px;border-bottom:0.5px solid #f0eeeb;background:#fafaf9;white-space:nowrap;}
.pred-table tbody td{padding:9px 12px;border-bottom:0.5px solid #f7f6f4;vertical-align:top;color:#444;line-height:1.4;}
.pred-table tbody tr:last-child td{border-bottom:none;}
.pred-table tbody td:first-child{font-weight:500;color:#111;font-size:11px;background:#fafaf9;border-right:0.5px solid #f0eeeb;white-space:nowrap;}
.cell-win{color:#db0962;font-weight:500;}
.cell-open{color:#aaa;}
.loading-state{padding:40px;text-align:center;color:#bbb;font-size:13px;}
.error-state{padding:20px;text-align:center;color:#a32d2d;font-size:12px;background:#fcebeb;border-radius:8px;margin:12px 0;line-height:1.7;}
.footer-note{font-size:12px;color:#ccc;text-align:center;margin-top:8px;padding-bottom:8px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">MoS'26-01 Basari Tahminleri</div>
  <div class="topbar-right">
    <div class="topbar-right-row">
      <button class="refresh-btn" id="refresh-btn" onclick="loadData()">
        <svg class="refresh-icon" id="refresh-icon" viewBox="0 0 13 13" fill="none">
          <path d="M11 2.5A5.5 5.5 0 1 0 12 6.5" stroke="#888" stroke-width="1.3" stroke-linecap="round"/>
          <polyline points="9,0.5 12,2.5 9,4.5" fill="none" stroke="#888" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Guncelle
      </button>
      <div class="badge-live"><span class="badge-dot"></span>Canli Takip</div>
    </div>
    <div class="update-info" id="update-info">—</div>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('ozet',this)">Genel Ozet</button>
  <button class="tab" onclick="switchTab('tahminler',this)">Katilimci Tahminleri</button>
</div>

<div id="tab-ozet" class="tab-content active">
  <div id="ozet-content"><div class="loading-state">Veriler yukleniyor...</div></div>
</div>
<div id="tab-tahminler" class="tab-content">
  <div id="tahminler-content"><div class="loading-state">Veriler yukleniyor...</div></div>
</div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbzUkqOX8Ab-iEUIG3R18tUXvZkKWAHUt1dqt6j0x78cko46eAc0EHBaXrxPGApEo5gJ1w/exec';
const CUP_GOLD='#b8860b',CUP_SILVER='#8a8a8a',CUP_BRONZE='#a0522d',CUP_OTHER='#db0962';

function cupSVG(c){return '<svg viewBox="0 0 18 18" fill="none" style="width:18px;height:18px;display:inline-block;vertical-align:middle;"><path d="M5 2h8v6a4 4 0 0 1-8 0V2z" fill="'+c+'" opacity=".9"/><path d="M3 2h2v3a2 2 0 0 1-2-2V2z" fill="'+c+'" opacity=".5"/><path d="M13 2h2v1a2 2 0 0 1-2 2V2z" fill="'+c+'" opacity=".5"/><rect x="7.5" y="11" width="3" height="3" fill="'+c+'" opacity=".7"/><rect x="5.5" y="14" width="7" height="1.5" rx="0.5" fill="'+c+'" opacity=".8"/></svg>';}

function norm(s){
  return String(s==null?'':s).trim().toLowerCase()
    .replace(/\s+/g,' ')
    .replace(/\u0049|\u0130/g,'i').replace(/\u0131/g,'i')
    .replace(/\u015e|\u015f/g,'s').replace(/\u011e|\u011f/g,'g')
    .replace(/\u00dc|\u00fc/g,'u').replace(/\u00d6|\u00f6/g,'o')
    .replace(/\u00c7|\u00e7/g,'c');
}

function getCol(obj,col){
  if(!obj)return'';
  const t=norm(col);
  const k=Object.keys(obj).find(k=>norm(k)===t);
  if(k!=null)return String(obj[k]==null?'':obj[k]).trim();
  const k2=Object.keys(obj).find(k=>k.trim()===col.trim());
  return k2!=null?String(obj[k2]==null?'':obj[k2]).trim():'';
}

function getIsimSoyisim(row){
  return getCol(row,'isim_soyisim')||getCol(row,'isim soyisim');
}
  const t=norm(val);
  return rows.find(r=>norm(getCol(r,col))===t)||null;
}

function nameMatch(a,b){
  if(!a||!b)return false;
  const na=norm(a),nb=norm(b);
  return na===nb||na.includes(nb)||nb.includes(na);
}

function fmtDate(s){
  if(!s||s==='')return'';
  try{
    const d=new Date(s);
    if(isNaN(d.getTime()))return String(s);
    if(String(s).includes('1899'))return ('0'+d.getUTCHours()).slice(-2)+':'+('0'+d.getUTCMinutes()).slice(-2);
    return d.toLocaleDateString('tr-TR');
  }catch(e){return String(s);}
}

function fmt(n){
  if(!n||n==='')return'';
  const num=parseFloat(String(n).replace(/[^0-9.]/g,''));
  if(isNaN(num))return String(n);
  return '\u20ba'+Math.round(num).toLocaleString('tr-TR');
}

function initials(name){
  const p=String(name).trim().split(' ');
  return(p[0]?.[0]||'')+(p[1]?.[0]||'');
}

const KAT_KEYS=['Ilk Satis','Ilk Randevu','En Yuksek Ciro','En Yuksek Satis','En Fazla Randevu','Satisa Donen Randevu'];

const KAT_LABEL={
  'Ilk Satis':'Ilk Satis',
  'Ilk Randevu':'Ilk Randevu',
  'En Yuksek Ciro':'Ilk Hafta En Yuksek Ciro',
  'En Yuksek Satis':'Ilk Hafta En Yuksek Satis',
  'En Fazla Randevu':'Ilk Hafta En Fazla Randevu',
  'Satisa Donen Randevu':'En Fazla Satisa Donen Randevu'
};

const KAT_TAH={
  'Ilk Satis':'ilk_satis',
  'Ilk Randevu':'ilk_randevu',
  'En Yuksek Ciro':'ilk_hafta_en_yuksek_ciro',
  'En Yuksek Satis':'ilk_hafta_en_yuksek_satis',
  'En Fazla Randevu':'ilk_hafta_en_fazla_randevu',
  'Satisa Donen Randevu':'ilk_hafta_en_fazla_satisa_donen_randevu'
};

const EXTRA_COL={
  'En Yuksek Ciro':'toplam_ciro',
  'En Yuksek Satis':'toplam_satis',
  'En Fazla Randevu':'toplam_randevu',
  'Satisa Donen Randevu':'toplam_satisa_donen'
};

async function loadData(){
  const btn=document.getElementById('refresh-btn');
  const icon=document.getElementById('refresh-icon');
  btn.disabled=true; icon.classList.add('spin');
  try{
    const data=await fetch(API_URL).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});
    const clean=arr=>(arr||[]).map(r=>{const o={};Object.keys(r).forEach(k=>o[k]=r[k]==null?'':String(r[k]));return o;});
    const sonuclar=clean(data.sonuclar);
    const tahminler=clean(data.tahminler);
    renderOzet(sonuclar,tahminler);
    renderTahminler(sonuclar,tahminler);
    const sr=sonuclar.find(r=>getCol(r,'guncelleme_tarihi')!=='');
    if(sr){
      const gt=fmtDate(getCol(sr,'guncelleme_tarihi'));
      const gs=fmtDate(getCol(sr,'guncelleme_saati'));
      document.getElementById('update-info').textContent='Son guncelleme: '+gt+(gs?' '+gs:'');
    }else{document.getElementById('update-info').textContent='—';}
  }catch(e){
    document.getElementById('ozet-content').innerHTML='<div class="error-state">Veri yuklenemedi: '+e.message+'</div>';
  }finally{btn.disabled=false;icon.classList.remove('spin');}
}

function renderOzet(sonuclar,tahminler){
  let snc=0;
  sonuclar.forEach(r=>{if(getCol(r,'gerceklesen_kisi')!=='')snc++;});

  const skorlar={};
  tahminler.forEach(r=>{const isim=getIsimSoyisim(r);if(isim)skorlar[isim]=0;});

  const kazMap={};
  KAT_KEYS.forEach(k=>{
    const sr=findRow(sonuclar,'kategori',k)||{};
    const grc=getCol(sr,'gerceklesen_kisi');
    kazMap[k]=[];
    if(!grc)return;
    tahminler.forEach(r=>{
      const isim=getIsimSoyisim(r);
      if(!isim) return;
      const tah=getCol(r,KAT_TAH[k]);
      if(nameMatch(tah,grc)){kazMap[k].push(isim);if(skorlar[isim]!==undefined)skorlar[isim]++;}
    });
  });

  const sorted=Object.entries(skorlar).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
  const tcRow=findRow(sonuclar,'kategori','En Yuksek Ciro')||{};
  const tcVal=getCol(tcRow,'toplam_ciro')||getCol(tcRow,'ciro')||'';
  const tcKisi=getCol(tcRow,'gerceklesen_kisi')||'';

  let h='<div class="summary-row">'
    +'<div class="stat-card"><div class="stat-label">Toplam Bahis</div><div class="stat-value">6</div><div class="stat-sub">kategori</div></div>'
    +'<div class="stat-card"><div class="stat-label">Sonuclanan</div><div class="stat-value accent">'+snc+'</div><div class="stat-sub">/ 6 kategori</div></div>'
    +'<div class="stat-card"><div class="stat-label">Lider</div><div class="stat-value" style="font-size:15px;padding-top:3px;">'+(sorted[0]?.[0]?.split(' ')[0]||'—')+'</div><div class="stat-sub">'+(sorted[0]?.[1]||0)+' dogru tahmin</div></div>'
    +'<div class="stat-card"><div class="stat-label">En Yuksek Ciro</div><div class="stat-value accent" style="font-size:17px;">'+(tcVal?fmt(tcVal):'—')+'</div><div class="stat-sub">'+(tcKisi||'bekleniyor')+'</div></div>'
    +'</div>';

  h+='<div class="section-title">Bahis Kategorileri</div><div class="bets-grid">';

  KAT_KEYS.forEach(k=>{
    const sr=findRow(sonuclar,'kategori',k)||{};
    const grc=getCol(sr,'gerceklesen_kisi');
    const done=grc!=='';
    const parts=[];
    const tarih=getCol(sr,'tarih'); if(tarih)parts.push(tarih);
    const saat=getCol(sr,'saat'); if(saat)parts.push(saat);
    const firma=getCol(sr,'firma_adi'); if(firma)parts.push(firma);
    const ciro=getCol(sr,'ciro');
    const exVal=EXTRA_COL[k]?getCol(sr,EXTRA_COL[k]):'';
    if(ciro)parts.push(fmt(ciro));
    else if(exVal&&(k==='En Yuksek Ciro'||k==='En Yuksek Satis'))parts.push(fmt(exVal));
    else if(exVal&&k==='En Fazla Randevu')parts.push(exVal+' randevu');
    else if(exVal&&k==='Satisa Donen Randevu')parts.push(exVal);

    const winners=kazMap[k]||[];
    let wHtml='';
    if(done&&winners.length>0){
      wHtml=winners.map((w,i)=>'<div class="winner-row"><span class="winner-num">'+(i+1)+'.</span><span class="winner-dot"></span>'+(w||'?')+'</div>').join('');
    }else if(done){
      wHtml='<div class="pending-name">Kimse bilmedi</div>';
    }else{
      wHtml='<div class="pending-name">Henuz belli degil</div>';
    }

    let lHtml='';
    if(!done&&exVal){
      if(k==='En Fazla Randevu')lHtml='<div class="current-detail">'+exVal+' randevu</div>';
      else if(k==='Satisa Donen Randevu')lHtml='<div class="current-detail">'+exVal+'</div>';
      else lHtml='<div class="current-detail">'+fmt(exVal)+'</div>';
    }

    h+='<div class="bet-card '+(done?'done':'')+'"><div class="bet-card-header"><span class="bet-cat">'+KAT_LABEL[k]+'</span><span class="pill '+(done?'pill-done':'pill-open')+'">'+(done?'Sonuclandi':'Devam Ediyor')+'</span></div>'
      +'<div class="bet-section"><div class="bet-section-label">'+(done?'Gerceklesen':'Suanki Lider')+'</div>'
      +(done?'<div class="result-person">'+grc+'</div><div class="result-detail">'+parts.join(' · ')+'</div>':'<div class="current-leader">'+(grc||'—')+'</div>'+lHtml)
      +'</div><div class="bet-section"><div class="bet-section-label">Kazananlar</div><div class="winners-list">'+wHtml+'</div></div></div>';
  });
  h+='</div>';

  h+='<div class="section-title">Siralama</div><div class="bets-table-wrap"><table><thead><tr><th>Siralama</th><th>Isim Soyisim</th><th>Basarili Tahmin</th><th>Devam Eden</th></tr></thead><tbody>';
  const devam=KAT_KEYS.filter(k=>!getCol(findRow(sonuclar,'kategori',k)||{},'gerceklesen_kisi')).length;
  sorted.forEach(([isim,puan],i)=>{
    const rank=i+1;
    let cc,rl;
    if(rank===1){cc=CUP_GOLD;rl='<span class="rank-1st">1.</span>';}
    else if(rank===2){cc=CUP_SILVER;rl='<span class="rank-num">2.</span>';}
    else if(rank===3){cc=CUP_BRONZE;rl='<span class="rank-num">3.</span>';}
    else{cc=CUP_OTHER;rl='<span class="rank-num">'+rank+'.</span>';}
    const cups=puan===0?'<span style="font-size:12px;color:#ddd;">—</span>':Array(puan).fill(cupSVG(cc)).join('');
    h+='<tr><td>'+rl+'</td><td><div class="name-cell"><span class="avatar '+(rank<=3?'av-top':'av-gray')+'">'+initials(isim)+'</span>'+isim+'</div></td><td><div class="cups">'+cups+'</div></td><td><span class="devam">'+devam+' bekleniyor</span></td></tr>';
  });
  h+='</tbody></table></div><div class="footer-note">Veriler Google Sheets\'ten cekilmektedir</div>';
  document.getElementById('ozet-content').innerHTML=h;
}

function renderTahminler(sonuclar,tahminler){
  const isimler=tahminler.map(r=>getIsimSoyisim(r)).filter(Boolean);
  let h='<div class="section-title">Katilimci Tahminleri — Tum Kategoriler</div><div class="pred-table-wrap"><table class="pred-table"><thead><tr><th>Kategori</th>';
  isimler.forEach(a=>{h+='<th>'+a.split(' ').map((p,i)=>i===0?p:p[0]+'.').join(' ')+'</th>';});
  h+='</tr></thead><tbody>';
  KAT_KEYS.forEach(k=>{
    const sr=findRow(sonuclar,'kategori',k)||{};
    const grc=getCol(sr,'gerceklesen_kisi');
    h+='<tr><td>'+KAT_LABEL[k]+'</td>';
    isimler.forEach(a=>{
      const row=tahminler.find(r=>getIsimSoyisim(r)===a)||{};
      const tah=getCol(row,KAT_TAH[k]);
      h+='<td class="'+(grc&&nameMatch(tah,grc)?'cell-win':'cell-open')+'">'+(tah||'—')+'</td>';
    });
    h+='</tr>';
  });
  h+='</tbody></table></div><div class="footer-note">Yesil: dogru tahmin · Gri: devam ediyor / yanlis</div>';
  document.getElementById('tahminler-content').innerHTML=h;
}

function switchTab(id,el){
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  el.classList.add('active');
}

loadData();
</script>
</body>
</html>
